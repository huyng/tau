[project]
name = "tau"
version = "0.1.0"
description = "A minimal AI coding agent for the terminal, modeled after pi"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.scripts]
tau = "tau.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

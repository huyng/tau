[project]
name = "tau"
version = "0.1.0"
description = "A minimal AI coding agent for the terminal, modeled after pi"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai>=1.50",
    "pytest>=9.1.1",
]

[project.scripts]
tau = "tau.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau"]
